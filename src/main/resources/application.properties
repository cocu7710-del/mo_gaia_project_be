spring.application.name=mo_gaia_project_be

# 배포 환경(Render 등)에서는 환경변수로 덮어씀 — 로컬 기본값은 docker compose의 gaia-db
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gaia}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:gaia}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:gaia}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Render는 PORT 환경변수로 포트를 지정
server.port=${PORT:8080}
# TLS 종료 프록시(Render) 뒤에서 https 스킴·쿠키가 올바르게 동작하도록
server.forward-headers-strategy=framework
